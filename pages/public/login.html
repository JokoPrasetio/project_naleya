<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masuk — Naleya</title>
    <link
      rel="stylesheet"
      href="../../assets/vendor/bootstrap/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../../styles/app.css" />
  </head>
  <body class="public-shell">
    <main class="login-shell">
      <section class="login-card">
        <a class="brand login-brand" href="../operations/dashboard.html"
          ><span class="brand-mark"><i class="bi bi-flower1 fs-5"></i></span
          ><span
            ><span class="brand-title d-block">Dashboard</span
            ><span class="brand-subtitle">Sistem pelayanan terpadu</span></span
          ></a
        >
        <div class="mt-5 mb-4">
          <span class="eyebrow text-success">Akses petugas</span>
          <h1 class="fs-4 fw-bold mt-2 mb-2">Selamat datang kembali</h1>
          <p class="text-muted mb-0">Masukkan akun Anda untuk melanjutkan.</p>
        </div>
        <form action="../operations/dashboard.html">
          <div class="mb-3">
            <label class="form-label" for="email">Email atau username</label
            ><input
              class="form-control"
              id="email"
              value="qa.satu@naleya.id"
              required
            />
          </div>
          <div class="mb-2">
            <div class="d-flex justify-content-between">
              <label class="form-label" for="password">Kata sandi</label
              ><a href="#" class="login-link">Lupa kata sandi?</a>
            </div>
            <input
              class="form-control"
              id="password"
              type="password"
              value="password"
              required
            />
          </div>
          <div class="form-check my-3">
            <input
              class="form-check-input"
              type="checkbox"
              id="remember"
            /><label class="form-check-label" for="remember"
              >Ingat saya di perangkat ini</label
            >
          </div>
          <button class="btn btn-naleya w-100 py-2" type="submit">
            Masuk ke dashboard
          </button>
        </form>
        <p class="login-help">
          Butuh bantuan akses? Hubungi administrator rumah sakit.
        </p>
      </section>
    </main>
  </body>
</html>
